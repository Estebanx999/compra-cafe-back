spring.application.name=compra-cafe-back

# Carga automática del archivo .env de la raíz del proyecto (si existe).
# Así la app (mvnw spring-boot:run) y los tests (mvnw test) encuentran las
# credenciales sin pasos manuales. Las variables de entorno del sistema
# tienen prioridad sobre .env. Si falta alguna variable obligatoria, la app
# se detiene diciendo cuál falta (ver ConfiguracionRequeridaValidator).
spring.config.import=optional:file:.env[.properties]

# --- Base de datos (valores desde .env / variables de entorno) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
# Hibernate NUNCA crea ni modifica tablas: solo valida que coinciden con las entidades.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway: única fuente del esquema ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public

# --- CORS (rutas /api/**) ---
# Orígenes del frontend, separados por coma (desde .env / variables de entorno).
app.cors.origenes-permitidos=${CORS_ORIGENES_PERMITIDOS}

# --- Idioma ---
# Siempre español, sin importar el Accept-Language del navegador ni el idioma del
# servidor: así los mensajes de validación (@NotBlank, @Size...) salen en español.
spring.web.locale=es
spring.web.locale-resolver=fixed

# --- Errores fuera de los controladores (filtros, /error): nunca exponer detalles ---
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never
